<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#FF00E5">
<animate attributeName="stop-color" values="#FF00E5;#00D9FF;#00FFC3;#FF00E5" dur="8s" repeatCount="indefinite"/>
</stop>
<stop offset="100%" stop-color="#00D9FF">
<animate attributeName="stop-color" values="#00D9FF;#00FFC3;#FF00E5;#00D9FF" dur="8s" repeatCount="indefinite"/>
</stop>
</linearGradient>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="8" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141420" stroke-width="1"/>
</pattern>
</defs>
<rect width="1200" height="300" fill="#050508"/>
<rect width="1200" height="300" fill="url(#grid)"/>
<text x="600" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="2" fill="url(#neon)" filter="url(#glow)">SAKSHAM SWAROOP</text>
<text x="600" y="185" text-anchor="middle" font-family="'Courier New', monospace" font-size="21" letter-spacing="3" fill="#8be9fd">SOFTWARE ENGINEER × BOT DEVELOPER × AI AUTOMATION</text>
<rect x="0" y="240" width="1200" height="2" fill="url(#neon)" opacity="0.5">
<animate attributeName="y" values="215;275;215" dur="7s" repeatCount="indefinite"/>
</rect>
<rect x="0" y="296" width="1200" height="4" fill="url(#neon)"/>
</svg>
