<text y="62" font-size="44" font-weight="800" fill="#FF00E5" filter="url(#sglow)">401
<animate attributeName="opacity" values="1;0.75;1" dur="2.4s" repeatCount="indefinite"/>
</text>
<text y="98" font-size="16" letter-spacing="2" fill="#9999aa">CONTRIBUTIONS</text>
</g>
<g transform="translate(453,0)">
<text y="62" font-size="44" font-weight="800" fill="#00D9FF" filter="url(#sglow)">336
<animate attributeName="opacity" values="1;0.75;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
</text>
<text y="98" font-size="16" letter-spacing="2" fill="#9999aa">COMMITS</text>
</g>
<g transform="translate(746,0)">
<text y="62" font-size="44" font-weight="800" fill="#00FFC3" filter="url(#sglow)">42
<animate attributeName="opacity" values="1;0.75;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
</text>
<text y="98" font-size="16" letter-spacing="2" fill="#9999aa">REPOS</text>
